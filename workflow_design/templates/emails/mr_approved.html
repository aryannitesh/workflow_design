<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: Arial, sans-serif; color: #333; line-height: 1.6;">

  <p>Dear Requester,</p>

  <p>
    Great news — your <strong>Material Request</strong> has been
    <strong style="color: #16a34a;">fully approved</strong>.
  </p>

  <table style="border-collapse: collapse; width: 100%; max-width: 540px;">
    <tr>
      <td style="padding: 6px 12px; font-weight: bold; background: #f5f5f5; border: 1px solid #ddd; width: 40%;">Document</td>
      <td style="padding: 6px 12px; border: 1px solid #ddd;">{{ doc_name }}</td>
    </tr>
    <tr>
      <td style="padding: 6px 12px; font-weight: bold; background: #f5f5f5; border: 1px solid #ddd;">Final Approval By</td>
      <td style="padding: 6px 12px; border: 1px solid #ddd;">{{ actor_full_name }}</td>
    </tr>
    <tr>
      <td style="padding: 6px 12px; font-weight: bold; background: #f5f5f5; border: 1px solid #ddd;">Status</td>
      <td style="padding: 6px 12px; border: 1px solid #ddd; color: #16a34a;">Approved</td>
    </tr>
  </table>

  <br>
  <p>
    <a href="{{ doc_url }}"
       style="background: #4f46e5; color: #fff; padding: 10px 20px;
              text-decoration: none; border-radius: 4px; display: inline-block;">
      View Material Request
    </a>
  </p>

  <p style="color: #888; font-size: 12px;">
    This is an automated notification from {{ site_name }}.
  </p>
</body>
</html>
